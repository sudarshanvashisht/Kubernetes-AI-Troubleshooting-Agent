apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-crashloop
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-crashloop
  template:
    metadata:
      labels:
        app: test-crashloop
    spec:
      containers:
      - name: app
        image: busybox:latest
        command: ["sh", "-c", "if [ -z \"$DATABASE_URL\" ]; then echo 'FATAL: Missing DATABASE_URL env var'; exit 1; fi"]
