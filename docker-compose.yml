services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ${KUBECONFIG_DIR:-${HOME}/.kube}:/root/.kube:ro
    networks:
      - default
      - ${KIND_NETWORK:-kind}
    env_file:
      - ./backend/.env
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
        NEXT_PUBLIC_INSFORGE_URL: ${NEXT_PUBLIC_INSFORGE_URL:-}
        NEXT_PUBLIC_INSFORGE_ANON_KEY: ${NEXT_PUBLIC_INSFORGE_ANON_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./frontend/.env.local
    networks:
      - default
    depends_on:
      - backend
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

networks:
  default:
  kind:
    name: ${KIND_NETWORK:-kind}
    external: true